name: 'nyu_ed_classification'
version: '0.1.0'
config-version: 2
require-dbt-version: ">=1.10.0"

profile: default

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  tuva_last_run: '{{ run_started_at.astimezone(modules.pytz.timezone("UTC")) }}'

seeds:
  nyu_ed_classification:
    value_sets:
      ed_classification:
        ed_classification__categories:
          +post-hook: "{{ the_tuva_project.load_seed(the_tuva_project.get_seed_bucket('value_sets') ~ '/data-marts/nyu-ed-classification/' ~ var('nyu_ed_classification_seed_version', '1.0.0'), 'ed_classification__categories.csv', true, true, true) }}"
        ed_classification__icd_10_cm_to_ccs:
          +post-hook: "{{ the_tuva_project.load_seed(the_tuva_project.get_seed_bucket('value_sets') ~ '/data-marts/nyu-ed-classification/' ~ var('nyu_ed_classification_seed_version', '1.0.0'), 'ed_classification__icd_10_cm_to_ccs.csv', true, true, true) }}"
        ed_classification__johnston_icd10:
          +post-hook: "{{ the_tuva_project.load_seed(the_tuva_project.get_seed_bucket('value_sets') ~ '/data-marts/nyu-ed-classification/' ~ var('nyu_ed_classification_seed_version', '1.0.0'), 'ed_classification__johnston_icd10.csv', true, true, true) }}"
        ed_classification__johnston_icd9:
          +post-hook: "{{ the_tuva_project.load_seed(the_tuva_project.get_seed_bucket('value_sets') ~ '/data-marts/nyu-ed-classification/' ~ var('nyu_ed_classification_seed_version', '1.0.0'), 'ed_classification__johnston_icd9.csv', true, true, true) }}"
